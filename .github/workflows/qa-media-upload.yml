name: QA do envio de mídia
on:
  push:
    paths:
      - 'scripts/upload_from_file.py'
      - 'tests/test_upload_from_file.py'
      - '.github/workflows/qa-media-upload.yml'
  pull_request:
    paths:
      - 'scripts/upload_from_file.py'
      - 'tests/test_upload_from_file.py'
      - '.github/workflows/qa-media-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar upload, validação e segurança
        run: python3 -m unittest discover -s tests -p 'test_upload_from_file.py' -v
