name: Importar mídia aprovada
on:
  push:
    paths:
      - 'requests/*.json'
  workflow_dispatch:
    inputs:
      asset_url:
        description: "URL HTTPS pública da imagem/vídeo aprovado"
        required: true
        type: string
      target_path:
        description: "Destino (ex.: posts/2026/11/post-regras-negocio.png)"
        required: true
        type: string
      expected_sha256:
        description: "SHA-256 opcional para verificar integridade"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: marketing-assets-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importar imagens de solicitações aprovadas
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse
          files = sorted(pathlib.Path('requests').glob('*.json'))
          if not files:
              raise SystemExit('Nenhuma solicitação encontrada')
          for file in files:
              data = json.loads(file.read_text(encoding='utf-8'))
              url = data['asset_url']
              # Solicitações são arquivos públicos; recusar query com tokens temporários.
              if urllib.parse.urlsplit(url).query or urllib.parse.urlsplit(url).fragment:
                  raise SystemExit(f'Não salve URL assinada em repositório público: {file}')
              env = os.environ.copy()
              env.update({
                  'ASSET_URL': url,
                  'TARGET_PATH': data['target_path'],
                  'EXPECTED_SHA256': data.get('expected_sha256', ''),
              })
              subprocess.run(['python3', 'scripts/import_asset.py'], env=env, check=True)
              file.unlink()
          PY
      - name: Importar mídia de URL fornecida na execução
        if: github.event_name == 'workflow_dispatch'
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          TARGET_PATH: ${{ inputs.target_path }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: python3 scripts/import_asset.py
      - name: Salvar arquivos verificados no GitHub
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Nenhuma mudança para salvar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- posts videos brand/logos requests
          git commit -m "assets: import approved marketing media"
          git push
      - name: Resumo
        run: |
          echo "Processamento concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
