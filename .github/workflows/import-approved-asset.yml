name: Importar mídia aprovada
on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: "URL HTTPS pública da imagem/vídeo aprovado"
        required: true
        type: string
      target_path:
        description: "Destino (ex.: posts/2026/11/post-regras-negocio.png)"
        required: true
        type: string
      expected_sha256:
        description: "SHA-256 opcional para verificar integridade"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: marketing-assets-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar origem e baixar mídia aprovada
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          TARGET_PATH: ${{ inputs.target_path }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: python3 scripts/import_asset.py
      - name: Verificar alteração
        id: changed
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Salvar mídia no repositório
        if: steps.changed.outputs.changed == 'true'
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git commit -m "assets: import approved media"
          git push
      - name: Resumo
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          echo "Mídia importada: $TARGET_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
